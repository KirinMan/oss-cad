[package]
name = "od-index"
description = "Spatial indexing for OpenDraft: an R-tree over drawing bounds, for view culling, picking, snapping and clash broad-phase."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
od-core = { workspace = true }
od-geom2d = { workspace = true }
od-geom3d = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "od-geom2d/serde", "od-geom3d/serde"]

[lints]
workspace = true
