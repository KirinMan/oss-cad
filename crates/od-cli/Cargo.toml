[package]
name = "od-cli"
description = "Headless OpenDraft: convert, inspect, check drawings and browse the part catalogue. Usable in CI and as the API's worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "od"
path = "src/main.rs"

[dependencies]
od-core = { workspace = true }
od-io-dxf = { workspace = true }
od-io-odc = { workspace = true }
od-parts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[lints]
workspace = true
